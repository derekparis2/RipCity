<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Facility</title>
  <link rel="stylesheet" href="css/styles.css?v=platform-registration-1&amp;review=flexible-platform-2&amp;workflow=performance-2&amp;nav=full-tabs-1&amp;layout=outlined-tabs-5&amp;feedback=visible-errors-1">

</head><body class="auth-body">
<main class="auth-page"><section class="auth-card">
  <div class="auth-brand"><span class="neutral-brand-mark" aria-hidden="true">T</span><div><h1>TRAINING PLATFORM</h1><p>Find your facility.</p></div></div>
  <div class="auth-heading"><p class="eyebrow">MEMBER REGISTRATION</p><h2>Enter your facility code</h2><p>Use the code or registration link provided by your facility. New accounts require approval.</p></div>
  <form id="registration-code-form" class="auth-form"><label for="registration-code">Facility code</label><input id="registration-code" autocomplete="off" autocapitalize="characters" maxlength="32" required><button class="primary-btn" type="submit">Find Facility</button></form>
  <p id="registration-code-message" class="auth-message" role="status" aria-live="polite"></p>
  <a id="registration-continue" class="primary-btn full-btn" hidden>Continue</a>
  <p class="auth-footer">Already registered? <a href="login.html">Log in</a>.</p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/shared/supabaseClient.js?errors=visible-feedback-1"></script><script src="js/auth/register.js?v=platform-registration-1&amp;errors=visible-feedback-1"></script>
</body></html>
