<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="js/shared/facility-appearance.js?v=facility-styles-1&amp;errors=visible-feedback-1"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Platform Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=ui-polish-4&amp;review=flexible-platform-2&amp;workflow=performance-2&amp;nav=full-tabs-1&amp;layout=outlined-tabs-5&amp;feedback=auth-session-2" />
  <link rel="stylesheet" href="css/facility-styles.css?v=facility-styles-12&amp;workflow=performance-2" />
  <script src="js/shared/feedback.js?v=visible-errors-1"></script>
  <link rel="stylesheet" href="css/feedback.css?v=visible-errors-1" />
</head>
<body class="auth-body">
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-brand">
        <span class="neutral-brand-mark" aria-hidden="true">T</span>
        <div>
          <h1>TRAINING PLATFORM</h1>
          <p>Your facility. Your training.</p>
        </div>
      </div>

      <div class="auth-heading">
        <p class="eyebrow">WELCOME BACK</p>
        <h2>Log In</h2>
        <p id="login-description">Access your facility account.</p>
      </div>

      <form id="login-form" class="auth-form" hidden>
        <div>
          <label for="login-identifier">Email or Username</label>
          <input id="login-identifier" type="text" autocomplete="username" required />
        </div>

        <div>
          <label for="login-password">Password</label>
          <input id="login-password" type="password" required />
        </div>

        <button type="submit" class="primary-btn full-btn">Log In</button>
      </form>

      <p class="auth-message" id="login-message" role="status" aria-live="polite">Checking your session...</p>

      <p class="auth-footer">
        <button type="button" class="auth-text-btn" id="forgot-password-btn">Forgot password?</button>
      </p>

      <p class="auth-footer">
        Need an account? <a href="register.html">Register with a facility code</a> or use the link from your facility.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.__ripAuthHash = window.location.hash;
  </script>
  <script src="js/shared/supabaseClient.js?errors=visible-feedback-1"></script>
  <script src="js/auth/auth.js?v=auth-reliability-3&amp;review=flexible-platform-2&amp;appearance=facility-styles-1&amp;session=existing-account-1&amp;errors=visible-feedback-1"></script>
</body>
</html>
