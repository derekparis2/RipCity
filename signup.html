<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rip City Signup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=signup-legal-2" />
</head>
<body class="auth-body">
  <main class="auth-page">
    <section class="auth-card wide-auth-card">
      <div class="auth-brand">
        <img src="assets/rip-city-logo.png" alt="Rip City logo">
        <div>
          <h1>RIP CITY</h1>
          <p>Athlete Development</p>
        </div>
      </div>

      <div class="auth-heading">
        <p class="eyebrow" id="signup-eyebrow">JOIN RIP CITY</p>
        <h2 id="signup-title">Create Account</h2>
        <p id="signup-description">After signing up, a facility administrator will assign your training group and approve your account.</p>
      </div>

      <form id="signup-form" class="auth-form">
        <div class="member-type-grid" id="signup-member-type-grid">
          <label class="member-type-card">
            <input type="radio" name="member-type" value="athlete" checked>
            <span>Athlete</span>
            <small>Workouts, goals, progress, coach notes, and development tracking.</small>
          </label>

          <label class="member-type-card">
            <input type="radio" name="member-type" value="h2k">
            <span>H2K Member</span>
            <small>Habit tracking, weekly score, training consistency, and accountability.</small>
          </label>
        </div>

        <div class="auth-grid">
          <div>
            <label for="signup-full-name">Full Name <span class="required-label">Required</span></label>
            <input id="signup-full-name" type="text" required />
          </div>

          <div>
            <label for="signup-email">Email <span class="required-label">Required</span></label>
            <input id="signup-email" type="email" required />
          </div>

          <div>
            <label for="signup-username">Username <span class="required-label">Required</span></label>
            <input id="signup-username" type="text" autocomplete="username" placeholder="ex: ripcity22" required />
          </div>

          <div>
            <label for="signup-password">Password <span class="required-label">Required</span></label>
            <input id="signup-password" type="password" minlength="6" required />
          </div>

          <div>
            <label for="signup-confirm-password">Re-enter Password <span class="required-label">Required</span></label>
            <input id="signup-confirm-password" type="password" minlength="6" required />
          </div>

          <div class="athlete-only">
            <label for="signup-sport">Sport</label>
            <select id="signup-sport">
              <option value="">Select sport</option>
              <option value="Baseball">Baseball</option>
              <option value="Softball">Softball</option>
              <option value="Basketball">Basketball</option>
              <option value="Football">Football</option>
              <option value="Soccer">Soccer</option>
              <option value="Volleyball">Volleyball</option>
              <option value="Lacrosse">Lacrosse</option>
              <option value="Track & Field">Track & Field</option>
              <option value="General Fitness">General Fitness</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="athlete-only">
            <label for="signup-position">Position</label>
            <input id="signup-position" type="text" placeholder="Example: Pitcher, Catcher, SS" />
          </div>

          <div class="athlete-only">
            <label for="signup-school">School</label>
            <input id="signup-school" type="text" />
          </div>

          <div class="athlete-only">
            <label for="signup-grad-year">Graduation Year</label>
            <input id="signup-grad-year" type="number" placeholder="2027" />
          </div>

          <div class="member-only">
            <label for="signup-body-weight">Body Weight</label>
            <input id="signup-body-weight" type="number" placeholder="Optional" />
          </div>
        </div>

        <fieldset class="signup-acknowledgments">
          <legend>Age confirmation</legend>

          <div class="signup-acknowledgment-heading">
            <p>Choose the one option that applies to you.</p>
            <button type="button" class="signup-clear-age" data-clear-age-choice="signup-age-bracket">Clear choice</button>
          </div>

          <div class="signup-age-options" role="radiogroup" aria-label="Age confirmation">
            <label class="signup-acknowledgment">
              <input id="signup-age-adult" name="signup-age-bracket" type="radio" value="18_or_older" required />
              <span>I am 18 years old or older.</span>
            </label>

            <label class="signup-acknowledgment">
              <input id="signup-age-minor" name="signup-age-bracket" type="radio" value="13_to_17" required />
              <span>I am 13–17 years old and have permission from my parent or legal guardian.</span>
            </label>
          </div>

        </fieldset>

        <div class="signup-legal-agreement">
          <p class="signup-legal-agreement-title">Terms and privacy</p>
          <label class="signup-acknowledgment">
            <input id="signup-legal-confirmation" type="checkbox" required />
            <span>
              I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a>
              and acknowledge the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.
            </span>
          </label>
        </div>

        <button type="submit" class="primary-btn full-btn">Create Account</button>
      </form>

      <p class="auth-message" id="signup-message"></p>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Log in here</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/shared/supabaseClient.js"></script>
  <script src="js/auth/auth.js?v=signup-legal-3"></script>
</body>
</html>
