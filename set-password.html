<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Rip City Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=password-flow-1" />
</head>
<body class="auth-body">
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-brand">
        <img src="assets/rip-city-logo.png" alt="Rip City logo">
        <div>
          <h1>RIP CITY</h1>
          <p>Athlete Development</p>
        </div>
      </div>

      <div class="auth-heading">
        <p class="eyebrow">ACCOUNT SETUP</p>
        <h2>Set Password</h2>
        <p>Create a password for your Rip City account, then you can log in any time.</p>
      </div>

      <form id="set-password-form" class="auth-form">
        <div>
          <label for="new-password">New Password</label>
          <input id="new-password" type="password" minlength="6" autocomplete="new-password" required />
        </div>

        <div>
          <label for="confirm-new-password">Re-enter Password</label>
          <input id="confirm-new-password" type="password" minlength="6" autocomplete="new-password" required />
        </div>

        <button type="submit" class="primary-btn full-btn">Save Password</button>
      </form>

      <p class="auth-message" id="set-password-message"></p>

      <p class="auth-footer">
        Already set one? <a href="login.html">Log in here</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/shared/supabaseClient.js"></script>
  <script src="js/auth/auth.js?v=password-flow-1"></script>
</body>
</html>
